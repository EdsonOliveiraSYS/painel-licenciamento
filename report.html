<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Relatório de licenças · ZentryxFit</title>
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <main class="report-shell">
    <header class="report-header">
      <div class="brand-mark">ZF</div>
      <div><p class="eyebrow">GESTÃO DE LICENÇAS</p><h1>ZentryxFit</h1><p>Relatório financeiro de parceiro</p></div>

    <section class="report-summary"><div><span>Parceiro</span><strong id="partnerName">—</strong><small id="partnerCnpj"></small></div><div><span>Período</span><strong id="period">—</strong></div><div><span>Total previsto</span><strong id="total">R$ 0,00</strong></div></section>
    <section class="report-content"><table><thead><tr><th>Academia</th><th>Vencimento</th><th>Situação</th><th>Valor ZentryxFit</th></tr></thead><tbody id="reportRows"></tbody></table></section>
    <footer><span id="generatedAt"></span><span>ZentryxFit · Gestão inteligente para academias</span></footer>
  </main>
  <div class="print-actions"><button id="printButton" type="button">Imprimir ou salvar em PDF</button></div>
  <script src="report.js"></script>
</body>
</html>
